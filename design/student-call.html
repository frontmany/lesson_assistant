<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Макет: звонок ученика</title>
  <!-- Макет экрана ученика. Стили и сетка плиток — настоящие (webapp/css, webapp/js/stage.js),
       участники и шкала подставные. Состояние — в адресе, см. design/README.md -->
  <link rel="stylesheet" href="../webapp/css/tokens.css">
  <link rel="stylesheet" href="../webapp/css/call.css">
  <link rel="stylesheet" href="../webapp/css/student.css">
  <link rel="stylesheet" href="mock-call.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="mic-off" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/></symbol>
    <symbol id="cam" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3"/></symbol>
    <symbol id="cam-off" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3M4 4l16 16"/></symbol>
    <symbol id="leave" viewBox="0 0 24 24"><path d="M3 14c5-5 13-5 18 0l-2.5 3-3.5-1.5v-3c-2-.7-4-.7-6 0v3L5.5 17z"/></symbol>
    <symbol id="ai-star" viewBox="0 0 24 24"><path d="M12 2.5c.7 5 3.5 7.8 8.5 8.5v1c-5 .7-7.8 3.5-8.5 8.5h-1c-.7-5-3.5-7.8-8.5-8.5v-1c5-.7 7.8-3.5 8.5-8.5z"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="chev-r" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="chev-l" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  </svg>

  <div class="app">
    <div class="lobby" id="lobby" hidden>
      <button class="back" aria-label="К классам"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="preview tile" id="preview">
        <span class="avatar" id="previewAvatar"></span>
        <div class="pv-ctrl">
          <button class="cbtn" id="pvMic"><svg class="i"><use href="#mic"/></svg></button>
          <button class="cbtn off" id="pvCam"><svg class="i"><use href="#cam-off"/></svg></button>
        </div>
      </div>
      <div class="lobby-text">
        <h1 id="lobbyTitle"></h1>
        <p id="lobbyText" hidden></p>
        <div class="actions" id="lobbyActions"></div>
      </div>
    </div>

    <div class="body" id="call" hidden>
      <section class="stage" id="stage" aria-label="Участники звонка">
        <div class="banner" id="banner" hidden><span class="spin"></span>Связь пропала. Переподключаемся…</div>
        <div class="tiles" id="tiles"></div>
        <div class="share" id="share" hidden><div class="shared" id="shared"><span class="you" id="sharedBy"></span></div><div class="strip" id="strip"></div></div>
        <button class="side prev" id="prev" aria-label="Предыдущая страница" hidden><svg class="i"><use href="#chev-l"/></svg></button>
        <button class="side next" id="next" aria-label="Следующая страница" hidden><svg class="i"><use href="#chev-r"/></svg></button>
        <div class="dots" id="pager" aria-hidden="true" hidden></div>
      </section>
    </div>
    <div class="meter-pill parked" id="scale" role="img">
      <svg class="ai" aria-hidden="true"><use href="#ai-star"/></svg>
      <ol class="meter" id="steps" aria-hidden="true"><li></li><li></li><li></li><li></li></ol>
    </div>
    <div class="toast" id="toast" hidden></div>
    <footer class="controls" id="controls" hidden>
      <button class="cbtn" id="btnMic"><svg class="i"><use href="#mic"/></svg></button>
      <button class="cbtn off" id="btnCam"><svg class="i"><use href="#cam-off"/></svg></button>
      <button class="cbtn leave" id="btnLeave"><svg class="i"><use href="#leave"/></svg></button>
    </footer>
  </div>

  <script type="module">
    import { $, NAMES, div, iconSpan, initials, lobby, params, person, setIconButton, span } from "./mock-call.js";
    const { createStage } = await import("../webapp/js/stage.js");

    // ?n= одноклассников, ?teacher=0 учитель ещё не вошёл, ?level=1..4 своя ступень, ?ana=off,
    // ?mic=0, ?share=1 учитель показывает экран, ?state=lobby|connecting|nomic|reconnecting|ended|over|fail
    const n = Math.max(0, +(params.get("n") ?? 4));
    const level = Math.min(4, Math.max(1, +(params.get("level") ?? 3)));
    const ana = params.get("ana") !== "off";
    const mic = params.get("mic") !== "0";
    const state = params.get("state") ?? "live";

    const pill = $("scale");
    pill.classList.toggle("off", !ana);
    [...$("steps").children].forEach((li, i) => li.classList.toggle("on", ana && i < level));

    const me = person("me", "Вы", { mic });
    const teacher = params.get("teacher") === "0" ? [] : [person("teacher", "Елена В.", { cam: true, speaking: true, hue: 210, screen: params.get("share") === "1" })];
    const classmates = NAMES.slice(0, n).map((name, i) => person(`s${i}`, name, { cam: i % 3 === 1, mic: i % 4 !== 2, hue: (i * 47 + 250) % 360 }));
    // как в приложении: учитель, затем ты, затем одноклассники
    const people = [...teacher, me, ...classmates];

    function tile(p, i) {
      const self = p === me;
      const el = div(`tile${p.isSpeaking ? " speaking" : ""}${self ? " self" : ""}`);
      el.style.setProperty("--h", (i * 47 + 200) % 360);
      const video = stage.video(p.getTrackPublication("camera"));
      if (video) { el.classList.add("cam"); el.append(video); }
      else el.append(span("avatar", initials(self ? "Пётр Новиков" : p.name)));
      if (p.getTrackPublication("microphone").isMuted) el.append(iconSpan("micoff", "mic-off"));
      if (self) { pill.classList.remove("parked"); el.append(pill); }
      el.title = p.name;
      return el;
    }

    const stage = createStage({ tile, name: (p) => p.name, redraw: () => render() });

    function render() {
      stage.render(people, { self: me, reconnecting: state === "reconnecting" });
      setIconButton($("btnMic"), mic, "mic");
    }

    if (["lobby", "connecting", "nomic", "over", "ended", "fail"].includes(state)) {
      lobby(state, { title: "Войти в урок?", avatar: "ПН" });
    } else {
      $("call").hidden = $("controls").hidden = false;
      if (!mic) { $("toast").textContent = "Микрофон выключен"; $("toast").hidden = false; }
      render();
    }
  </script>
</body>
</html>
