<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Макет: звонок учителя</title>
  <!-- Макет экрана учителя. Стили и сетка плиток — настоящие (webapp/css, webapp/js/stage.js),
       участники и шкалы подставные. Состояние — в адресе, см. design/README.md -->
  <link rel="stylesheet" href="../webapp/css/tokens.css">
  <link rel="stylesheet" href="../webapp/css/call.css">
  <link rel="stylesheet" href="mock-call.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="mic-off" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/></symbol>
    <symbol id="cam" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3"/></symbol>
    <symbol id="cam-off" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3M4 4l16 16"/></symbol>
    <symbol id="screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M12 14V8M9 11l3-3 3 3"/></symbol>
    <symbol id="leave" viewBox="0 0 24 24"><path d="M3 14c5-5 13-5 18 0l-2.5 3-3.5-1.5v-3c-2-.7-4-.7-6 0v3L5.5 17z"/></symbol>
    <symbol id="more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.8" fill="currentColor" stroke="none"/></symbol>
    <symbol id="chev-r" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="chev-l" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="chev-u" viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></symbol>
    <symbol id="chev-d" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  </svg>

  <div class="app">
    <div class="lobby" id="lobby" hidden>
      <button class="back" aria-label="К классам"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="preview tile" id="preview">
        <span class="avatar" id="previewAvatar"></span>
        <div class="pv-ctrl">
          <button class="cbtn" id="pvMic"><svg class="i"><use href="#mic"/></svg></button>
          <button class="cbtn off" id="pvCam"><svg class="i"><use href="#cam-off"/></svg></button>
        </div>
      </div>
      <div class="lobby-text">
        <h1 id="lobbyTitle"></h1>
        <p id="lobbyText" hidden></p>
        <div class="actions" id="lobbyActions"></div>
      </div>
    </div>

    <div class="body" id="call" hidden>
      <section class="stage" id="stage" aria-label="Участники звонка">
        <div class="banner" id="banner" hidden><span class="spin"></span>Связь пропала. Переподключаемся…</div>
        <div class="tiles" id="tiles"></div>
        <div class="share" id="share" hidden><div class="shared" id="shared"><span class="you" id="sharedBy"></span></div><div class="strip" id="strip"></div></div>
        <button class="side prev" id="prev" aria-label="Предыдущая страница" hidden><svg class="i"><use href="#chev-l"/></svg></button>
        <button class="side next" id="next" aria-label="Следующая страница" hidden><svg class="i"><use href="#chev-r"/></svg></button>
        <div class="dots" id="pager" aria-hidden="true" hidden></div>
      </section>
      <aside class="panel" id="panel" aria-label="Панель класса">
        <div class="panel-head">
          <h2>Класс</h2><span class="count" id="count"></span>
          <button class="iconbtn" id="collapse" aria-label="Свернуть панель"><svg class="i"><use href="#chev-r"/></svg></button>
        </div>
        <div class="chips" id="chips" hidden></div>
        <div class="plist" id="plist"></div>
      </aside>
      <button class="expand" id="expand" aria-label="Показать панель класса" hidden><svg class="i"><use href="#chev-l"/></svg></button>
    </div>
    <div class="toast" id="toast" hidden></div>
    <footer class="controls" id="controls" hidden>
      <button class="cbtn" id="btnMic"><svg class="i"><use href="#mic"/></svg></button>
      <button class="cbtn off" id="btnCam"><svg class="i"><use href="#cam-off"/></svg></button>
      <button class="cbtn" id="btnScreen"><svg class="i"><use href="#screen"/></svg></button>
      <button class="cbtn leave" id="btnLeave"><svg class="i"><use href="#leave"/></svg></button>
    </footer>

    <div class="lobby ended" id="ended" hidden>
      <div class="lobby-text">
        <span class="done"><svg class="i"><use href="#check"/></svg></span>
        <h1>Урок завершён</h1>
        <div class="facts"><span>38 минут</span><span id="studentsCount"></span></div>
        <button class="primary">К&nbsp;классам</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { $, NAMES, button, div, iconSpan, initials, lobby, params, person, setIconButton, span, svg } from "./mock-call.js";
    const { createStage, mobile } = await import("../webapp/js/stage.js");

    // ?n= людей в звонке (с учителем), ?panel=0 свёрнутая панель, ?share=1 показ экрана,
    // ?mode=start шкал ещё нет, ?menu=<ученик> меню выключателя, ?state=lobby|connecting|nomic|muted|reconnecting|over|ended|fail
    const n = Math.max(1, +(params.get("n") ?? 6));
    const state = params.get("state") ?? "live";
    const started = params.get("mode") !== "start";
    const menuFor = params.get("menu");
    let panelOpen = params.get("panel") === null ? !mobile.matches : params.get("panel") === "1";

    const FLAG_TEXT = { long_silence: "давно не отвечал", quiet_but_precise: "редко, но развёрнуто" };
    const LAST = [
      "Пётр построил флот на Балтике и основал Петербург.", "Налог брали с каждого мужчины, а не с двора.",
      "Армию набирали рекрутами, по одному с двадцати дворов.", "Бороды брили, чтобы было как в Европе.",
    ];
    // ученики: ступень, метки, последняя реплика, выключена ли аналитика
    const students = NAMES.slice(0, Math.max(0, n - 1)).map((name, i) => ({
      id: `s${i}`, name,
      level: [3, 2, 4, 1, 2, 1, 3, 2][i % 8],
      flags: i % 8 === 3 ? ["long_silence"] : i % 8 === 4 ? ["quiet_but_precise"] : i % 8 === 5 ? ["long_silence"] : [],
      last: i % 8 < 4 ? LAST[i % 4] : "",
      off: i === 6,
    }));

    const people = [
      person("teacher", "Вы", { mic: state !== "muted" }),
      ...students.map((s, i) => person(s.id, s.name, { cam: i % 4 === 1, mic: i % 5 !== 2, speaking: i === 0, hue: (i * 47 + 200) % 360 })),
    ];
    if (params.get("share") === "1") people[0] = person("teacher", "Вы", { screen: true });

    function tile(p, i) {
      const self = p.identity === "teacher";
      const el = div(`tile${p.isSpeaking ? " speaking" : ""}${self ? " self" : ""}`);
      el.style.setProperty("--h", (i * 47 + 200) % 360);
      const video = stage.video(p.getTrackPublication("camera"));
      if (video) { el.classList.add("cam"); el.append(video); }
      else el.append(span("avatar", initials(self ? "Елена Викторовна" : p.name)));
      if (p.getTrackPublication("microphone").isMuted) el.append(iconSpan("micoff", "mic-off"));
      el.title = p.name;
      return el;
    }

    const stage = createStage({ tile, name: (p) => p.name, redraw: () => render() });

    function row(s, compact) {
      const el = div(`stu${compact ? " compact" : ""}${s.off ? " off" : ""}`);
      const line = div("stu-line");
      line.append(span("stu-name", s.name));
      const flags = started && !s.off ? s.flags.map((f) => span(`flag ${f}`, FLAG_TEXT[f])) : [];
      const bars = div("bars");
      for (let k = 1; k <= 4; k++) bars.append(span(`bar${started && k <= s.level ? " on" : ""}`, ""));
      const dots = document.createElement("button");
      dots.className = `iconbtn${menuFor === s.id ? " open" : ""}`;
      dots.append(svg("more"));
      if (!started) { line.append(dots); el.append(line); }
      else if (compact) { line.append(...flags, bars, dots); el.append(line); }
      else {
        if (s.off) line.append(span("stu-label", "аналитика выключена"));
        line.append(...flags, dots);
        el.append(line, bars);
        if (s.last && !s.off) el.append(Object.assign(document.createElement("p"), { className: "stu-last", textContent: `«${s.last}»` }));
      }
      if (menuFor === s.id) {
        const menu = div("menu");
        const item = div("menu-item");
        const label = span("", "Аналитика для ученика");
        label.append(Object.assign(document.createElement("small"), { textContent: "Когда выключена, ученик не попадает в шкалу" }));
        const sw = document.createElement("button");
        sw.className = `switch${s.off ? " off" : ""}`;
        sw.append(span("track", ""));
        item.append(label, sw);
        menu.append(item);
        el.append(menu);
      }
      return el;
    }

    function renderPanel() {
      const compact = students.length >= 9;
      $("panel").hidden = !panelOpen || students.length === 0;
      $("expand").hidden = panelOpen || students.length === 0;
      $("expand").querySelector("use").setAttribute("href", mobile.matches ? "#chev-u" : "#chev-l");
      $("collapse").querySelector("use").setAttribute("href", mobile.matches ? "#chev-d" : "#chev-r");
      $("count").textContent = `Учеников: ${students.length}`;
      const count = (f) => students.filter((s) => s.flags.includes(f)).length;
      $("chips").hidden = !compact || !started;
      $("chips").replaceChildren(
        Object.assign(button("chip on", `Все ${students.length}`)),
        button("chip", `Давно не отвечали ${count("long_silence")}`),
        button("chip", `Редко, но развёрнуто ${count("quiet_but_precise")}`),
      );
      const rank = (s) => Math.min(2, ...s.flags.map((f) => ({ long_silence: 0, quiet_but_precise: 1 })[f] ?? 2));
      const list = started ? [...students].sort((a, b) => rank(a) - rank(b)) : students;
      $("plist").replaceChildren(...list.map((s) => row(s, compact)));
    }

    function render() {
      renderPanel();
      stage.render(people, { self: people[0], reconnecting: state === "reconnecting" });
      setIconButton($("btnMic"), state !== "muted", "mic");
      $("btnScreen").classList.toggle("active", params.get("share") === "1");
    }

    $("collapse").onclick = () => { panelOpen = false; render(); };
    $("expand").onclick = () => { panelOpen = true; render(); };

    if (["lobby", "connecting", "nomic", "over", "fail"].includes(state)) {
      lobby(state, { title: "Готовы войти?", avatar: "ЕВ" });
    } else if (state === "ended") {
      $("ended").hidden = false;
      $("studentsCount").textContent = `Учеников: ${students.length}`;
    } else {
      $("call").hidden = $("controls").hidden = false;
      if (state === "muted") { $("toast").textContent = "Микрофон выключен. Ученики вас не слышат"; $("toast").hidden = false; }
      render();
    }
  </script>
</body>
</html>
