<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Урок в MAX</title>
  <!-- Стартовая страница мини-приложения (#24). Открыли кнопкой бота — сразу ведёт в урок:
       c<id> — учитель начинает урок класса, l<id> — урок, учителю панель, ученику его экран.
       Открыли кнопкой приложения — «Мои классы» по design/classes.html: классы, экран класса
       с учениками, «Пригласить», «Создать класс», демо. Логика — js/start.js и js/class.js -->
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--ink); line-height: 1.4; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    main { max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; }
    .i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    /* Экран: шапка, прокручиваемая середина, кнопки внизу — как .screen в design/classes.html */
    .view { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
    .top { display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 6px 8px; }
    .top h1 { margin: 0; font-size: 20px; line-height: 1.2; }
    .top small { display: block; font-size: 13px; font-weight: 400; color: var(--ink-soft); }
    .top .title { flex: 1; min-width: 0; padding-left: 8px; }
    .top .logo { width: 32px; height: 32px; margin-left: 8px; border-radius: 9px; flex: none; }
    .ib { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; flex: none; }
    .ib:focus-visible, .btn:focus-visible, .row:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 16px; }
    .text { margin: 4px 4px 12px; color: var(--ink-soft); font-size: 15px; }

    .list { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .list > li { min-width: 0; position: relative; }
    .row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 8px 8px 8px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); text-align: left; }
    .row .main { flex: 1; min-width: 0; }
    .row .name { display: block; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .sub { display: block; font-size: 13px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .sub.live { color: var(--accent); font-weight: 600; }
    .row .go { color: var(--ink-soft); margin-right: 6px; }
    .ava { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent-tint); color: var(--accent); font-weight: 700; font-size: 14px; }

    /* кнопки чуть выше края: над полоской жестов телефона */
    .bottom { display: flex; gap: 8px; padding: 12px 16px calc(28px + env(safe-area-inset-bottom)); background: var(--bg); }
    .bottom.col { flex-direction: column; }
    .btn { flex: 1; min-height: 48px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: 16px; text-align: center; display: inline-flex; align-items: center; justify-content: center; }
    .btn.primary { background: var(--accent); color: var(--surface); }
    .btn.ghost { background: var(--surface); border: 1px solid var(--line-strong); }

    /* Пустое состояние */
    .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 24px 32px; }
    .empty h2 { margin: 0; font-size: 18px; }
    .empty p { margin: 0; color: var(--ink-soft); font-size: 15px; max-width: 28ch; }
    .empty .glyph { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-tint); color: var(--accent); margin-bottom: 10px; }
    .empty .glyph .i { width: 28px; height: 28px; }

    /* Меню за троеточием */
    .menu { position: absolute; right: 8px; top: 52px; z-index: 2; min-width: 180px; padding: 4px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow-float); }
    .menu button { width: 100%; min-height: 40px; padding: 0 12px; border-radius: 8px; font-weight: 600; text-align: left; font-size: 15px; color: var(--danger); }

    /* Сообщение внизу */
    .toast { position: absolute; left: 12px; right: 12px; bottom: 84px; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 16px; border-radius: 12px; background: var(--slide); color: var(--on-slide); box-shadow: var(--shadow-float); font-size: 15px; }
    .toast span { flex: 1; min-width: 0; }
    .toast button { min-height: 44px; padding: 0 14px; font-weight: 700; color: var(--accent-on-scrim); }

    /* Ссылка и код */
    .link-card { margin: 4px 0 0; padding: 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
    .link-card .cap { display: block; margin-bottom: 8px; font-size: 13px; color: var(--ink-soft); }
    .link-card code { display: block; font-family: var(--font); font-size: 15px; font-weight: 600; color: var(--accent); word-break: break-all; }
    .code-card { margin-top: 8px; }
    .code-card code.big { font-family: ui-monospace, Consolas, monospace; font-size: 28px; font-weight: 700; letter-spacing: 0.12em; color: var(--ink); }
    .stack { display: grid; gap: 8px; margin-top: 16px; }

    /* Новый класс */
    .field { display: block; margin: 4px 0 14px; }
    .field span { display: block; margin: 0 0 6px 4px; font-size: 13px; color: var(--ink-soft); }
    .field input { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 16px; }
    .field input:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
    .error { margin: 0 4px; color: var(--danger); font-size: 14px; }

    .dev { display: grid; gap: 8px; margin: 16px 4px 0; font-size: 14px; }
    .dev a { color: var(--ink-soft); }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.9.6 3.2 2.3 3.5 5.2"/></symbol>
  </svg>
  <main>
    <!-- Мои классы -->
    <div class="view" id="home">
      <!-- наш знак: иконка мини-приложения (design/bot/miniapp-icon.png), в бейдже звезда вместо «AI» -->
      <div class="top"><img class="logo" src="img/logo.png" alt="" width="32" height="32"><div class="title"><h1 id="title">Мои классы</h1></div></div>
      <div class="scroll">
        <p class="text" id="text" hidden></p>
        <ul class="list" id="classes" hidden></ul>
        <!-- Для разработки (DEV_AUTH=1): урок демо-класса без MAX -->
        <nav class="dev" id="dev" hidden>
          <a href="teacher.html">Учитель демо-класса</a>
          <a href="student.html?id=artem_k">Ученик: Артём К.</a>
          <a href="student.html?id=alisa_n">Ученик: Алиса Н.</a>
        </nav>
      </div>
      <div class="empty" id="homeEmpty" hidden>
        <div class="glyph"><svg class="i"><use href="#i-people"/></svg></div>
        <h2>Классов пока нет</h2>
        <p>Создайте первый, чтобы пригласить учеников</p>
      </div>
      <div class="bottom col" id="actions" hidden>
        <button class="btn ghost" id="demo">Посмотреть демо</button>
        <button class="btn primary" id="create">Создать класс</button>
      </div>
    </div>

    <!-- Класс: ученики, «Пригласить», «Начать урок» (js/class.js) -->
    <div class="view" id="classView" hidden>
      <div class="top">
        <button class="ib" id="classBack" aria-label="К классам"><svg class="i"><use href="#i-back"/></svg></button>
        <div class="title"><h1 id="className"></h1><small id="classCount"></small></div>
      </div>
      <div class="scroll" id="studentsScroll"><ul class="list" id="students"></ul></div>
      <div class="empty" id="classEmpty" hidden>
        <div class="glyph"><svg class="i"><use href="#i-people"/></svg></div>
        <h2>В классе пока никого</h2>
        <p>Отправьте ссылку, и ученики появятся здесь</p>
      </div>
      <div class="toast" id="undo" role="status" hidden><span id="undoText"></span><button id="undoBtn">Вернуть</button></div>
      <div class="bottom">
        <button class="btn ghost" id="inviteBtn">Пригласить</button>
        <button class="btn primary" id="classStart">Начать урок</button>
      </div>
    </div>

    <div class="view" id="inviteView" hidden>
      <div class="top">
        <button class="ib" id="inviteBack" aria-label="К ученикам"><svg class="i"><use href="#i-back"/></svg></button>
        <div class="title"><h1 id="inviteTitle"></h1></div>
      </div>
      <div class="scroll">
        <div class="link-card" id="linkCard"><span class="cap">Ссылка</span><code id="inviteLink"></code></div>
        <div class="link-card code-card"><span class="cap">Код класса</span><code class="big" id="inviteCode"></code></div>
        <div class="stack">
          <button class="btn primary" id="copyLink">Копировать ссылку</button>
          <button class="btn ghost" id="copyCode">Копировать код</button>
        </div>
      </div>
    </div>

    <!-- Новый класс -->
    <form class="view" id="createView" hidden>
      <div class="top">
        <button class="ib" type="button" id="createBack" aria-label="К классам"><svg class="i"><use href="#i-back"/></svg></button>
        <div class="title"><h1>Новый класс</h1></div>
      </div>
      <div class="scroll">
        <label class="field"><span>Класс</span><input id="newName" maxlength="40" placeholder="10А" autocomplete="off" required></label>
        <label class="field"><span>Предмет</span><input id="newSubject" maxlength="60" placeholder="история" autocomplete="off" required></label>
        <p class="error" id="createError" hidden></p>
      </div>
      <div class="bottom"><button class="btn primary" type="submit">Создать</button></div>
    </form>
  </main>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <script type="module" src="js/start.js"></script>
</body>
</html>
