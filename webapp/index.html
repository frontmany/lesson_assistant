<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Урок в MAX</title>
  <!-- Стартовая страница мини-приложения (#24). Открыли кнопкой бота — сразу ведёт в урок:
       c<id> — учитель начинает урок класса, l<id> — урок, учителю панель, ученику его экран.
       Открыли кнопкой приложения — классы человека, демо и чат с ботом. Логика — js/start.js -->
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--ink); }
    main { max-width: 420px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: 32px 20px; display: flex; flex-direction: column; }
    /* логотип Сферума на белой плашке, чтобы читался и на тёмном фоне: как в design/start.html */
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .brand img { width: 32px; height: 32px; padding: 3px; border-radius: 9px; background: #fff; object-fit: contain; flex: none; }
    .brand span { font-weight: 700; font-size: 18px; letter-spacing: 0.01em; }
    h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.2; }
    .text { margin: 0 0 24px; color: var(--ink-soft); font-size: 15px; line-height: 1.5; }
    .classes { display: grid; gap: 10px; margin: 16px 0 24px; }
    .card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
    /* всё в одну строку: не помещается «10А, история» — остаётся «10А» (js/start.js, fitNames) */
    .card > div { flex: 1; min-width: 0; }
    .card-name, .card-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-name { font-weight: 600; font-size: 16px; }
    .card-meta { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
    /* урок идёт: точка перед подписью, как в design/start.html */
    .card-meta.live::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--accent); }
    .card button.off { background: var(--surface-muted); color: var(--ink-soft); cursor: default; }
    .card { flex-wrap: wrap; }
    .card-hint { flex-basis: 100%; margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); }
    .spacer { flex: 1; }
    button { font: inherit; font-weight: 600; border: 0; cursor: pointer; border-radius: 999px; padding: 12px 20px; }
    .card button { padding: 8px 14px; font-size: 14px; background: var(--accent); color: var(--surface); flex: none; }
    .actions { display: grid; gap: 10px; }
    .primary { background: var(--ink); color: var(--surface); }
    .secondary { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); }
    .dev { display: grid; gap: 8px; margin-top: 16px; font-size: 14px; }
    .dev a { color: var(--ink-soft); }

    /* Экран класса и «Пригласить» — по design/classes.html */
    .view { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
    .card button.open { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); }
    .top { display: flex; align-items: center; gap: 8px; margin: -8px 0 16px -10px; }
    .top h2 { margin: 0; font-size: 22px; line-height: 1.2; }
    .top small { display: block; font-size: 13px; color: var(--ink-soft); }
    .ib { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; padding: 0; background: transparent; color: var(--ink); }
    .ib:hover { background: var(--surface-muted); }
    .i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .list { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; } /* без своей прокрутки: иначе меню «⋯» у последнего ученика обрезается */
    .list > li { min-width: 0; position: relative; }
    .row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 8px 8px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
    .row .name { flex: 1; min-width: 0; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ava { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent-tint); color: var(--accent); font-weight: 700; font-size: 14px; }
    .menu { position: absolute; right: 8px; top: 56px; z-index: 2; min-width: 190px; padding: 6px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow-float); }
    .menu button { width: 100%; min-height: 44px; padding: 0 12px; border-radius: 8px; text-align: left; font-size: 15px; background: transparent; color: var(--danger); }
    .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 24px; }
    .empty h3 { margin: 0; font-size: 18px; }
    .empty p { margin: 0; color: var(--ink-soft); font-size: 15px; max-width: 28ch; }
    .bottom { display: flex; gap: 8px; padding-top: 12px; }
    .bottom button { flex: 1; }
    .toast { position: absolute; left: 0; right: 0; bottom: 64px; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 16px; border-radius: 12px; background: var(--slide); color: var(--on-slide); box-shadow: var(--shadow-float); font-size: 15px; }
    .toast span { flex: 1; min-width: 0; }
    .toast button { min-height: 44px; padding: 0 14px; background: transparent; color: var(--accent-on-scrim); }
    .link-card { display: flex; align-items: center; gap: 8px; margin: 4px 0 0; padding: 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
    .link-card code { display: block; font-family: var(--font); font-size: 15px; font-weight: 600; color: var(--accent); word-break: break-all; }
    .link-card .val { flex: 1; min-width: 0; }
    .link-card .ib.done { color: var(--accent); }
    .code-card { margin-top: 8px; }
    .link-card .cap { display: block; font-size: 13px; color: var(--ink-soft); }
    .code-card code.big { font-family: ui-monospace, Consolas, monospace; font-size: 28px; font-weight: 700; letter-spacing: 0.12em; color: var(--ink); }
    .help { margin: 12px 4px 0; color: var(--ink-soft); font-size: 15px; }
    .stack { display: grid; gap: 8px; margin-top: 16px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <!-- шар Сферума из design/bot/sferum-logo.png, 128 px для чётких экранов. Не официальный файл:
         будет SVG из брендбука — заменить img/sferum.png -->
    <div class="view" id="home">
    <div class="brand"><img src="img/sferum.png" alt="" width="32" height="32"><span>Сферум</span></div>
    <h1 id="title">Урок в MAX</h1>
    <p class="text" id="text" hidden></p>
    <section class="classes" id="classes" hidden></section>
    <div class="spacer"></div>
    <div class="actions" id="actions" hidden>
      <button class="primary" id="demo">Посмотреть демо</button>
    </div>
    <!-- Для разработки (DEV_AUTH=1): урок демо-класса без MAX -->
    <nav class="dev" id="dev" hidden>
      <a href="teacher.html">Учитель демо-класса</a>
      <a href="student.html?id=artem_k">Ученик: Артём К.</a>
      <a href="student.html?id=alisa_n">Ученик: Алиса Н.</a>
    </nav>
    </div>

    <!-- Класс: ученики, «Пригласить», «Начать урок» (js/class.js) -->
    <div class="view" id="classView" hidden>
      <div class="top">
        <button class="ib" id="classBack" aria-label="К классам"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div><h2 id="className"></h2><small id="classCount"></small></div>
      </div>
      <ul class="list" id="students"></ul>
      <div class="empty" id="classEmpty" hidden>
        <h3>В классе пока никого</h3>
        <p>Отправьте ссылку, и ученики появятся здесь</p>
      </div>
      <div class="spacer"></div>
      <div class="toast" id="undo" role="status" hidden><span id="undoText"></span><button id="undoBtn">Вернуть</button></div>
      <div class="bottom">
        <button class="secondary" id="inviteBtn">Пригласить</button>
        <button class="primary" id="classStart">Начать урок</button>
      </div>
    </div>

    <div class="view" id="inviteView" hidden>
      <div class="top">
        <button class="ib" id="inviteBack" aria-label="К ученикам"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h2 id="inviteTitle"></h2>
      </div>
      <div class="link-card" id="linkCard"><div class="val"><span class="cap">Ссылка для учеников</span><code id="inviteLink"></code></div><button class="ib" id="copyLink" aria-label="Копировать ссылку"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button></div>
      <div class="link-card code-card"><div class="val"><span class="cap">Код класса</span><code class="big" id="inviteCode"></code></div><button class="ib" id="copyCode" aria-label="Копировать код"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button></div>
      <div class="stack">
        <button class="secondary" id="share" hidden>Поделиться</button>
      </div>
    </div>
  </main>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <script type="module" src="js/start.js"></script>
</body>
</html>
