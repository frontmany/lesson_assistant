<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Урок: учитель</title>
  <!-- Экран звонка учителя по макету design/teacher-call.html (#4, #7). Логика — js/teacher.js -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/call.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="mic-off" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/></symbol>
    <symbol id="cam" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3"/></symbol>
    <symbol id="cam-off" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3M4 4l16 16"/></symbol>
    <symbol id="screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M12 14V8M9 11l3-3 3 3"/></symbol>
    <symbol id="chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c3 0 5 2 5 5"/></symbol>
    <symbol id="leave" viewBox="0 0 24 24"><path d="M3 14c5-5 13-5 18 0l-2.5 3-3.5-1.5v-3c-2-.7-4-.7-6 0v3L5.5 17z"/></symbol>
    <symbol id="more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.8" fill="currentColor" stroke="none"/></symbol>
    <symbol id="pulse" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
    <symbol id="chev-r" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="chev-l" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="chev-u" viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></symbol>
    <symbol id="chev-d" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>  </svg>

  <div class="app">
    <!-- До входа, подключение и нет микрофона -->
    <div class="lobby" id="lobby">
      <div class="preview tile" id="preview">
        <span class="avatar" id="previewAvatar"></span>
        <div class="pv-ctrl">
          <button class="cbtn" id="pvMic" aria-label="Выключить микрофон"><svg class="i"><use href="#mic"/></svg></button>
          <button class="cbtn off" id="pvCam" aria-label="Включить камеру"><svg class="i"><use href="#cam-off"/></svg></button>
        </div>
      </div>
      <div class="lobby-text">
        <h1 id="lobbyTitle">Готовы войти?</h1>
        <p id="lobbyText" hidden></p>
        <div class="actions" id="lobbyActions"></div>
      </div>
    </div>

    <!-- В уроке -->
    <div class="body" id="call" hidden>
      <section class="stage" id="stage" aria-label="Участники звонка">
        <div class="banner" id="banner" hidden><span class="spin"></span>Связь пропала. Переподключаемся…</div>
        <div class="tiles" id="tiles"></div>
        <div class="share" id="share" hidden><div class="shared" id="shared"><span class="you" id="sharedBy"></span></div><div class="strip" id="strip"></div></div>
        <div class="pager" id="pager" hidden>
          <button class="pb" id="prev" aria-label="Предыдущая страница"><svg class="i sm"><use href="#chev-l"/></svg></button>
          <span id="pageNo"></span>
          <button class="pb" id="next" aria-label="Следующая страница"><svg class="i sm"><use href="#chev-r"/></svg></button>
          <span id="pageInfo"></span>
        </div>
      </section>
      <aside class="panel" id="panel" aria-label="Панель класса">
        <div class="panel-head">
          <h2>Класс</h2><span class="count" id="count"></span>
          <button class="iconbtn" id="collapse" aria-label="Свернуть панель" title="Свернуть"><svg class="i"><use href="#chev-r"/></svg></button>
        </div>
        <p class="hint" id="hint" hidden></p>
        <div class="chips" id="chips" hidden></div>
        <div class="plist" id="plist"></div>
      </aside>
      <button class="expand" id="expand" aria-label="Показать панель класса" title="Показать панель класса" hidden><svg class="i"><use href="#chev-l"/></svg></button>
    </div>
    <div class="toast" id="toast" hidden></div>
    <footer class="controls" id="controls" hidden>
      <button class="cbtn" id="btnMic" aria-label="Выключить микрофон" title="Выключить микрофон"><svg class="i"><use href="#mic"/></svg></button>
      <button class="cbtn" id="btnCam" aria-label="Включить камеру" title="Включить камеру"><svg class="i"><use href="#cam-off"/></svg></button>
      <button class="cbtn" id="btnScreen" aria-label="Показать экран" title="Показать экран"><svg class="i"><use href="#screen"/></svg></button>
      <button class="cbtn leave" id="btnLeave" aria-label="Завершить урок" title="Завершить урок"><svg class="i"><use href="#leave"/></svg></button>
    </footer>

    <!-- Урок завершён -->
    <div class="lobby ended" id="ended" hidden>
      <div class="lobby-text">
        <span class="done"><svg class="i"><use href="#check"/></svg></span>
        <h1>Урок завершён</h1>
        <div class="facts"><span id="duration"></span><span id="studentsCount"></span></div>
        <p>Сводка по&nbsp;уроку придёт в&nbsp;чат с&nbsp;ботом примерно через минуту</p>
        <button class="primary" id="backToChat" hidden>Вернуться в&nbsp;чат</button>
      </div>
    </div>
  </div>

  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.js"></script>
  <script type="module" src="js/teacher.js"></script>
</body>
</html>
