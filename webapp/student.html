<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Урок: ученик</title>
  <!-- Экран ученика в звонке (#22). Логика — js/student.js. Экран до входа и сцена звонка —
       общие с учителем (css/call.css, js/stage.js); своё — только шкала (css/student.css) -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/call.css">
  <link rel="stylesheet" href="css/student.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="mic-off" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/></symbol>
    <symbol id="cam" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3"/></symbol>
    <symbol id="cam-off" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3M4 4l16 16"/></symbol>
    <symbol id="leave" viewBox="0 0 24 24"><path d="M3 14c5-5 13-5 18 0l-2.5 3-3.5-1.5v-3c-2-.7-4-.7-6 0v3L5.5 17z"/></symbol>
    <symbol id="pulse" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
    <symbol id="pulse-off" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4M4 4l16 16"/></symbol>
    <symbol id="ai-star" viewBox="0 0 24 24"><path d="M12 2.5c.7 5 3.5 7.8 8.5 8.5v1c-5 .7-7.8 3.5-8.5 8.5h-1c-.7-5-3.5-7.8-8.5-8.5v-1c5-.7 7.8-3.5 8.5-8.5z"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="chev-r" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="chev-l" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  </svg>

  <div class="app">
    <!-- До входа, подключение и нет микрофона -->
    <div class="lobby" id="lobby">
      <button class="back" id="lobbyBack" aria-label="К классам"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="preview tile" id="preview">
        <span class="avatar" id="previewAvatar"></span>
        <div class="pv-ctrl">
          <button class="cbtn" id="pvMic" aria-label="Выключить микрофон"><svg class="i"><use href="#mic"/></svg></button>
          <button class="cbtn off" id="pvCam" aria-label="Включить камеру"><svg class="i"><use href="#cam-off"/></svg></button>
        </div>
      </div>
      <div class="lobby-text">
        <h1 id="lobbyTitle">Войти в&nbsp;урок?</h1>
        <p id="lobbyText" hidden></p>
        <div class="actions" id="lobbyActions"></div>
      </div>
    </div>

    <!-- В уроке: та же сцена, что у учителя (js/stage.js), без панели класса -->
    <div class="body" id="call" hidden aria-label="Звонок, экран ученика">
      <section class="stage" id="stage" aria-label="Участники звонка">
        <div class="banner" id="banner" hidden><span class="spin"></span>Связь пропала. Переподключаемся…</div>
        <div class="tiles" id="tiles"></div>
        <div class="share" id="share" hidden><div class="shared" id="shared"><span class="you" id="sharedBy"></span></div><div class="strip" id="strip"></div></div>
        <button class="side prev" id="prev" aria-label="Предыдущая страница" hidden><svg class="i"><use href="#chev-l"/></svg></button>
        <button class="side next" id="next" aria-label="Следующая страница" hidden><svg class="i"><use href="#chev-r"/></svg></button>
        <div class="dots" id="pager" aria-hidden="true" hidden></div>
      </section>
    </div>
    <!-- Своя шкала: js переносит её вниз своей плитки. Звезда «AI» и четыре сегмента,
         название ступени — в подсказке и для экранного чтения -->
    <div class="meter-pill parked" id="scale" role="img">
      <svg class="ai" aria-hidden="true"><use href="#ai-star"/></svg>
      <ol class="meter" id="steps" aria-hidden="true"></ol>
    </div>
    <span class="sr" aria-live="polite" role="status" id="status"></span>
    <div class="toast" id="toast" hidden></div>
    <!-- Показывать экран ученику нельзя: это право только учителя (app/call.py) -->
    <footer class="controls" id="controls" hidden>
      <button class="cbtn" id="btnMic" aria-label="Выключить микрофон" title="Выключить микрофон"><svg class="i"><use href="#mic"/></svg></button>
      <button class="cbtn" id="btnCam" aria-label="Включить камеру" title="Включить камеру"><svg class="i"><use href="#cam-off"/></svg></button>
      <button class="cbtn leave" id="btnLeave" aria-label="Выйти из урока" title="Выйти из урока"><svg class="i"><use href="#leave"/></svg></button>
    </footer>
  </div>

  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.js"></script>
  <script type="module" src="js/student.js"></script>
</body>
</html>
