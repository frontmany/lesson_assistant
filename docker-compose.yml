# Полный стек, приложение, LiveKit и PostgreSQL
services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      DATABASE_URL: postgresql://assistant:assistant@postgres:5432/assistant
    ports:
      - "8000:8000"
    volumes:
      - models:/srv/models  # модели скачиваются один раз
      - ./saved_phrases:/srv/saved_phrases
    depends_on:
      livekit:
        condition: service_started
      # приложение ждёт готовности базы
      postgres:
        condition: service_healthy

  # LiveKit в режиме разработки, ключи devkey и secret
  livekit:
    image: livekit/livekit-server:v1.13.7
    # адрес машины в локальной сети, до него доходят браузер и ассистент
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:?впиши в .env LIVEKIT_NODE_IP — IPv4 машины в локальной сети}
    ports:
      - "7880:7880"  # сигнализация
      - "7881:7881"  # медиа по TCP
      - "7882:7882/udp"  # медиа по UDP

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  models:
